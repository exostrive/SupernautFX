name: Gradle Build

on: [push, pull_request]

jobs:
  publish:
    name: Build and publish SupernautFX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: 5.x-exostrive

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '23'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="5.0.${GITHUB_RUN_NUMBER}-exostrive"
          ./gradlew publishAllPublicationsToGitHubPackagesRepository -Pversion="$VERSION"
